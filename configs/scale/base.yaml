# @package _global_
# Default networks: cheap enough for many-environment RL rollouts.
dim: 128                         # shared latent width (z_touch, tokens, z_target, z_diff)
depth: 2                         # blocks / layers per module (per stage in the target encoder)
attn_groups: 8                   # vector-attention weight groups G (dim / G channels share one weight)
attn_rel_dim: 16                 # width R of the attention relation phi(q) - psi(k) + delta (R = dim: original layer)
policy_hidden: [256, 256, 128]   # hidden widths of the actor and critic MLPs
